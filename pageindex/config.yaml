# Existing PageIndex settings (unchanged)
model: "gemini-3.1-pro-preview"
toc_check_page_num: 20
max_page_num_each_node: 10
max_token_num_each_node: 20000
if_add_node_id: "yes"
if_add_node_summary: "yes"
if_add_doc_description: "no"
if_add_node_text: "no"

# LLM abstraction settings
llm:
  completion_model: "gemini/gemini-2.0-flash"
  embedding_model: "gemini/gemini-embedding-001"
  embedding_dimensions: 768
  temperature: 0

# Supabase settings (env vars override)
supabase:
  url_env: "SUPABASE_URL"
  key_env: "SUPABASE_KEY"

# Ingestion pipeline settings
ingestion:
  metadata_pages: 3          # Number of pages to scan for metadata extraction
  chunk_max_tokens: 800      # Maximum tokens per chunk before splitting
  chunk_overlap: 0.1         # Overlap ratio between consecutive sub-chunks (10%)
  max_workers: 1             # Concurrent document processing threads (1 = sequential)
  max_embedding_batch: 250   # Maximum texts per embedding API call