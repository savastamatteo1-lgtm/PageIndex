# Legacy key kept for ConfigLoader backward compatibility (actual model comes from llm.tree_indexing_model)
model: null

# Existing PageIndex settings (unchanged)
toc_check_page_num: 20
max_page_num_each_node: 10
max_token_num_each_node: 20000
if_add_node_id: "yes"
if_add_node_summary: "yes"
if_add_doc_description: "no"
if_add_node_text: "no"

# LLM abstraction settings
llm:
  completion_model: "gemini/gemini-2.0-flash"
  tree_indexing_model: "gemini/gemini-2.0-flash"
  embedding_model: "gemini/gemini-embedding-001"
  embedding_dimensions: 768
  temperature: 0
  num_retries: 10

# Supabase settings (env vars override)
supabase:
  url_env: "SUPABASE_URL"
  key_env: "SUPABASE_KEY"

# Ingestion pipeline settings
ingestion:
  metadata_pages: 3          # Number of pages to scan for metadata extraction
  chunk_max_tokens: 800      # Maximum tokens per chunk before splitting
  chunk_overlap: 0.1         # Overlap ratio between consecutive sub-chunks (10%)
  max_workers: 1             # Concurrent document processing threads (1 = sequential)
  max_embedding_batch: 250   # Maximum texts per embedding API call

# Retrieval strategy settings
retrieval:
  default_top_k: 10
  default_strategy: "auto"
  rrf_k: 60
  engine_weights:
    metadata: 1.0
    semantic: 1.0
    description: 1.0
  global_min_score: 0.01
  internal_fetch_multiplier: 2
  docscore_min_threshold: 0.3
  metadata_min_threshold: 0.25
  description_min_threshold: 0.6
  confidence_thresholds:
    metadata:
      high: 0.7
      medium: 0.4
    semantic:
      high: 0.6
      medium: 0.35
    description:
      high: 0.8
      medium: 0.6
    tree_search:
      high: 0.7
      medium: 0.4
  tree_search_top_n: 5
  tree_search_max_concurrency: 5
  metadata_max_retries: 3
  doc_score_method: "canonical"   # "canonical" or "topk_mean"
  doc_score_topk_k: 3            # Number of top chunks to average in topk_mean mode